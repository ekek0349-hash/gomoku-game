
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Kitty Gomoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">♡ CUTE GOMOKU CLUB ♡</div>
      <h1>Hello Kitty Gomoku</h1>
      <p>귀여운 고양이 친구들과 오목 한 판! 🎀</p>
    </header>

    <section class="game-layout">
      <aside class="side-panel">
        <div class="panel-card">
          <h2>🎀 게임 설정</h2>
          <label for="difficulty">AI 난이도</label>
          <select id="difficulty">
            <option value="easy">초보냥이</option>
            <option value="normal" selected>보통냥이</option>
            <option value="hard">고수냥이</option>
          </select>
          <div class="player-card human">
            <span class="player-icon">🐱</span>
            <div>
              <strong>나</strong>
              <small>리본 고양이</small>
            </div>
            <span class="turn-dot" id="humanDot"></span>
          </div>
          <div class="player-card computer">
            <span class="player-icon">🐾</span>
            <div>
              <strong>AI</strong>
              <small>핑크 고양이</small>
            </div>
            <span class="turn-dot" id="aiDot"></span>
          </div>
          <p id="message" class="message" aria-live="polite">내 차례야! 원하는 곳에 돌을 놓아봐 💗</p>
          <button id="restartBtn" class="primary-btn">새 게임 시작</button>
          <button id="undoBtn" class="secondary-btn">한 수 무르기</button>
        </div>

        <div class="panel-card record-card">
          <h2>🌸 나의 전적</h2>
          <div class="record-row"><span>승리</span><strong id="wins">0</strong></div>
          <div class="record-row"><span>패배</span><strong id="losses">0</strong></div>
          <div class="record-row"><span>승률</span><strong id="winRate">0%</strong></div>
          <div class="record-row"><span>연승</span><strong id="streak">0</strong></div>
          <button id="resetStatsBtn" class="text-btn">전적 초기화</button>
        </div>
      </aside>

      <section class="board-card">
        <div class="board-heading">
          <span>🎀 Kitty's Pink Board 🎀</span>
          <span class="board-subtitle">가로 · 세로 · 대각선 다섯 개!</span>
        </div>
        <div class="board-frame">
          <canvas id="board" width="750" height="750" aria-label="15줄 오목 게임판"></canvas>
        </div>
        <p class="board-note">검은 돌은 33·44·장목 금수 규칙이 적용돼요.</p>
      </section>
    </section>

    <footer>Made with ♡ and lots of pink ribbons</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
