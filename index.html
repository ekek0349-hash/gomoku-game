
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헬로키티 오목</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="ribbon">🎀</div>
      <p class="small-title">MY LOVELY GOMOKU</p>
      <h1>HELLO KITTY 오목</h1>
      <p class="subtitle">귀여운 고양이 친구와 오목 한 판! ♡</p>
    </header>

    <section class="game-layout">
      <div class="board-card">
        <div class="board-top">
          <span>🎀 KITTY BOARD 🎀</span>
          <span id="turnLabel">내 차례예요!</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="board" width="600" height="600"></canvas>
        </div>
        <p class="board-hint">고양이 돌을 놓아 다섯 개를 연결해 보세요 ♡</p>
      </div>

      <aside class="side-panel">
        <div class="panel-card">
          <h2>🐱 게임 설정</h2>
          <label for="difficulty">컴퓨터 난이도</label>
          <select id="difficulty">
            <option value="easy">🌸 쉬움</option>
            <option value="normal" selected>🎀 보통</option>
            <option value="hard">💗 어려움</option>
          </select>
          <button id="newGameBtn" class="pink-btn">새 게임 시작</button>
          <button id="undoBtn" class="light-btn">↩ 무르기</button>
        </div>

        <div class="panel-card">
          <h2>💌 게임 기록</h2>
          <div class="stats">
            <div><span>승리</span><strong id="wins">0</strong></div>
            <div><span>패배</span><strong id="losses">0</strong></div>
            <div><span>승률</span><strong id="winRate">0%</strong></div>
            <div><span>연승</span><strong id="streak">0</strong></div>
          </div>
          <button id="resetStatsBtn" class="reset-btn">기록 초기화</button>
        </div>

        <div class="panel-card character-card">
          <div class="kitty-icon">🎀</div>
          <strong>오늘의 오목 친구</strong>
          <p id="message">준비됐나요? 첫 수를 놓아보세요!</p>
        </div>

        <div class="rule-card">
          <strong>📌 금수 규칙</strong>
          <p>흑돌은 33·44·장목이 금지됩니다.</p>
          <p>흑돌은 정확히 5개를 연결해야 승리합니다.</p>
        </div>
      </aside>
    </section>

    <footer>MADE WITH LOVE ♡ HELLO KITTY GOMOKU</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
